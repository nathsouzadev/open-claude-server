global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: open-claude-server

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OTEL Collector internal metrics (about the collector itself).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  # Claude Code metrics arrive via OTLP at the collector and are exposed for
  # Prometheus to scrape on /metrics (otel-collector prometheus exporter).
  - job_name: claude-code
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  # Express server /metrics endpoint (prom-client).
  - job_name: claude-api
    metrics_path: /metrics
    static_configs:
      - targets: ["server:3010"]

  # Loki + Tempo + Grafana self-metrics (handy for dashboarding the stack).
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
