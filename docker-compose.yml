services:
  claude:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-501}"
        USER_GID: "${USER_GID:-501}"
    image: open-claude-server:latest
    container_name: claude-workspace
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      TERM: xterm-256color
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
    volumes:
      - ./workspace/claude-workspace/claude-config:/home/claude/.claude
      - ./workspace/claude-workspace/skills:/home/claude/.claude/skills
      - ./workspace/claude-workspace/projects:/workspace/projects
      - ${HOME}/.claude-mem:/home/claude/.claude-mem
      # Sync host's per-project auto-memory (MEMORY.md + .md files) into the
      # container-encoded path. Host source path uses the host's project dir
      # encoding; override via PROJECT_MEMORY_HOST_DIR env in .env if you clone
      # elsewhere. Target encoded from CLAUDE_CWD=/workspace/projects.
      - ${PROJECT_MEMORY_HOST_DIR:-${HOME}/.claude/projects/-Users-nathallysouza-Documents-Projects-open-claude-server/memory}:/home/claude/.claude/projects/-workspace-projects/memory
      - ${HOME}/.gitconfig:/home/claude/.gitconfig:ro
      - ${HOME}/.ssh:/tmp/host-ssh:ro

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-501}"
        USER_GID: "${USER_GID:-501}"
    image: open-claude-server:latest
    container_name: open-claude-server
    working_dir: /workspace/server
    command: ["node", "src/index.js"]
    ports:
      - "127.0.0.1:${SERVER_PORT:-3010}:3010"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3010"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_CWD: ${CLAUDE_CWD:-/workspace/projects}
      CLAUDE_TIMEOUT_MS: ${CLAUDE_TIMEOUT_MS:-120000}
      CLAUDE_MAX_INPUT_CHARS: ${CLAUDE_MAX_INPUT_CHARS:-50000}
      CLAUDE_MAX_CONCURRENCY: ${CLAUDE_MAX_CONCURRENCY:-3}
      CLAUDE_QUEUE_MAX_WAIT_MS: ${CLAUDE_QUEUE_MAX_WAIT_MS:-30000}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
    restart: unless-stopped
    mem_limit: ${SERVER_MEM_LIMIT:-4g}
    mem_reservation: ${SERVER_MEM_RESERVATION:-512m}
    pids_limit: ${SERVER_PIDS_LIMIT:-256}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./workspace/claude-workspace/claude-config:/home/claude/.claude
      - ./workspace/claude-workspace/skills:/home/claude/.claude/skills
      - ./workspace/claude-workspace/projects:/workspace/projects
      - ${HOME}/.claude-mem:/home/claude/.claude-mem
      # Sync host's per-project auto-memory (MEMORY.md + .md files) into the
      # container-encoded path. Host source path uses the host's project dir
      # encoding; override via PROJECT_MEMORY_HOST_DIR env in .env if you clone
      # elsewhere. Target encoded from CLAUDE_CWD=/workspace/projects.
      - ${PROJECT_MEMORY_HOST_DIR:-${HOME}/.claude/projects/-Users-nathallysouza-Documents-Projects-open-claude-server/memory}:/home/claude/.claude/projects/-workspace-projects/memory
      - ./server:/workspace/server
      - server_node_modules:/workspace/server/node_modules

volumes:
  server_node_modules:
