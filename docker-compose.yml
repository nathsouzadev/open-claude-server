services:
  claude:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-501}"
        USER_GID: "${USER_GID:-501}"
    image: claude-server:latest
    container_name: claude-workspace
    stdin_open: true
    tty: true
    working_dir: /workspace
    env_file:
      # Forwards the whole root .env (including GH_TOKEN_<AGENT>/GITHUB_TOKEN_<AGENT>
      # overrides) into the container so the interactive `claude` TUI can resolve
      # per-agent tokens. Variables explicitly listed under `environment:` below
      # still win on conflict.
      - path: ./.env
        required: false
    environment:
      TERM: xterm-256color
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
    volumes:
      # Point WORKSPACE_DIR at your private workspace (defaults to the example template shipped with this repo).
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/claude-config:/home/claude/.claude
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/skills:/home/claude/.claude/skills
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/projects:/workspace/projects
      - ${HOME}/.claude-mem:/home/claude/.claude-mem
      # Sync host's per-project auto-memory (MEMORY.md + .md files) into the
      # container-encoded path. Override PROJECT_MEMORY_HOST_DIR in your .env
      # if your host clone path differs. Target encoded from CLAUDE_CWD=/workspace/projects.
      - ${PROJECT_MEMORY_HOST_DIR:-${HOME}/.claude/projects/-workspace-projects/memory}:/home/claude/.claude/projects/-workspace-projects/memory
      - ${HOME}/.gitconfig:/home/claude/.gitconfig:ro
      - ${HOME}/.ssh:/tmp/host-ssh:ro

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-501}"
        USER_GID: "${USER_GID:-501}"
    image: claude-server:latest
    container_name: claude-server
    working_dir: /workspace/server
    command: ["npx", "tsx", "src/index.ts"]
    ports:
      - "127.0.0.1:${SERVER_PORT:-3010}:3010"
    env_file:
      # Root .env first: brings in GH_TOKEN_<AGENT>/GITHUB_TOKEN_<AGENT> per-agent
      # overrides used by services/agentEnv.ts. The server/.env stays as a per-
      # service override slot; values in it win over the root .env.
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3010"
      HOST: "0.0.0.0"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      API_TOKEN: ${API_TOKEN:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      CLAUDE_BIN: ${CLAUDE_BIN:-claude}
      CLAUDE_CWD: ${CLAUDE_CWD:-/workspace/projects}
      CLAUDE_TIMEOUT_MS: ${CLAUDE_TIMEOUT_MS:-120000}
      CLAUDE_MAX_INPUT_CHARS: ${CLAUDE_MAX_INPUT_CHARS:-50000}
      CLAUDE_MAX_CONCURRENCY: ${CLAUDE_MAX_CONCURRENCY:-3}
      CLAUDE_QUEUE_MAX_WAIT_MS: ${CLAUDE_QUEUE_MAX_WAIT_MS:-30000}
      # Mode B (claude on host): consumed by scripts/claude-bridge.mjs.
      CLAUDE_WORKER_URL: ${CLAUDE_WORKER_URL:-}
      CLAUDE_WORKER_TOKEN: ${CLAUDE_WORKER_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GH_TOKEN:-}
    restart: unless-stopped
    mem_limit: ${SERVER_MEM_LIMIT:-4g}
    mem_reservation: ${SERVER_MEM_RESERVATION:-512m}
    pids_limit: ${SERVER_PIDS_LIMIT:-256}
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/claude-config:/home/claude/.claude
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/skills:/home/claude/.claude/skills
      - ${WORKSPACE_DIR:-./workspace/claude-workspace}/projects:/workspace/projects
      - ${HOME}/.claude-mem:/home/claude/.claude-mem
      - ${PROJECT_MEMORY_HOST_DIR:-${HOME}/.claude/projects/-workspace-projects/memory}:/home/claude/.claude/projects/-workspace-projects/memory
      - ./server:/workspace/server
      - server_node_modules:/workspace/server/node_modules
      # Mode B: host-claude-bridge script lives at /workspace/scripts/claude-bridge.mjs
      - ./scripts:/workspace/scripts:ro
    extra_hosts:
      # Make host.docker.internal resolve on Linux (already works on macOS/Windows).
      - "host.docker.internal:host-gateway"

  # ---------- Observability stack ----------
  # Single OTLP entry point. Claude Code on the host writes here
  # (CLAUDE_CODE_ENABLE_TELEMETRY=1 + OTEL_EXPORTER_OTLP_ENDPOINT). The
  # collector fans out: metrics -> Prometheus (scraped on :8889), logs -> Loki,
  # traces -> Tempo.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.1
    container_name: claude-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "127.0.0.1:${OTEL_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:8889:8889"   # Prometheus scrape target (claude-code metrics)
      - "127.0.0.1:8888:8888"   # collector self-metrics
      - "127.0.0.1:13133:13133" # health_check extension
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: claude-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: claude-loki
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: claude-tempo
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    volumes:
      - ./observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: claude-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_data:/tmp
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: claude-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANON_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  server_node_modules:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
  promtail_data:
